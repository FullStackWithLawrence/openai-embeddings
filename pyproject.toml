[build-system]
requires = ["setuptools", "wheel"]

[tool.coverage.run]
source = ["models"]
omit = [
    "models/tests/*",
    # The YouTube video's script. Nothing imports it, and its methods call live
    # OpenAI and Pinecone APIs.
    "models/yt.py",
]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.isort]
profile = "black"
lines_after_imports = 2

[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | node_modules
  | build
  | buck-out
  | build
  | dist
)/
'''

[tool.codespell]
skip = '*.svg,models/prompt_templates.py'
ignore-words = 'codespell.txt'
